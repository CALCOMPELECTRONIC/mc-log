<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Label Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#F4F8FB;margin:0;padding:20px;color:#1A202C}
.box{max-width:760px;margin:0 auto}
h2{margin:0 0 14px;color:#2C79D2}
label{display:block;font-size:12px;font-weight:700;color:#718096;margin:12px 0 4px}
input,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #E2E8F0;border-radius:8px;font:inherit}
textarea{min-height:130px;font-family:Consolas,monospace;font-size:13px}
.hint{font-size:12px;color:#718096;margin-top:4px}
button{margin-top:14px;margin-right:8px;padding:11px 20px;border:none;border-radius:10px;background:linear-gradient(120deg,#2C79D2,#0D8FCF);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.o{background:#fff;color:#0D8FCF;border:1.5px solid #0D8FCF}
#out{display:grid;grid-template-columns:repeat(auto-fill,300px);gap:16px;margin-top:20px;justify-content:center}
.label{width:300px;border:2px solid #1A202C;border-radius:10px;padding:14px;text-align:center;background:#fff;break-inside:avoid;page-break-inside:avoid}
.nm{font-size:22px;font-weight:700}
.cd{font-size:15px;font-family:Consolas,monospace;margin:2px 0 8px}
.pd{font-size:13px;color:#555}
.scan{font-size:12px;margin-top:6px}
.qr{display:flex;justify-content:center;margin:8px 0}
.url{font-size:10px;color:#718096;word-break:break-all;margin-top:8px}
#msg{font-size:13px;color:#D93025;margin-top:8px}
@media print{
  body{background:#fff;padding:0}
  .box>*:not(#out){display:none}
  #out{margin:0;gap:10px;grid-template-columns:repeat(2,300px)}
  .url{display:none}
}
</style></head><body><div class="box">
<h2>สร้าง QR ป้ายเครื่อง (หลายเครื่อง) / QR Labels</h2>

<label>ลิงก์หน้าเว็บ (Base URL ของ index.html)</label>
<input id="base">

<label>รายชื่อเครื่อง: 1 บรรทัดต่อ 1 เครื่อง ในรูปแบบ  รหัสเครื่อง, ชื่อเครื่อง, Product</label>
<textarea id="list">MC-00015, USW MC#1, A19</textarea>
<div class="hint">คัดลอกจาก Excel มาวางได้เลย (3 คอลัมน์: รหัส / ชื่อ / Product) ไม่ใส่ Product ก็ได้</div>

<button onclick="gen()">สร้าง QR</button>
<button class="o" onclick="loadFromSystem()">ดึงรายชื่อจากระบบ</button>
<button class="o" onclick="window.print()">🖨 พิมพ์ทั้งหมด</button>
<div id="msg"></div>

<div id="out"></div>
</div>
<script>
const FB = 'https://machine-e63df-default-rtdb.asia-southeast1.firebasedatabase.app';
const $ = id => document.getElementById(id);
$('base').value = location.href.replace(/qr\.html.*$/, 'index.html');

function parse(){
  return $('list').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(/\t|,/).map(s => s.trim());
    return {code:(p[0]||'').toUpperCase(), name:p[1]||'', prod:p[2]||''};
  }).filter(m => m.code);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function gen(){
  const base = $('base').value.trim(), out = $('out');
  out.innerHTML = '';
  parse().forEach(m => {
    const url = base + (base.includes('?') ? '&' : '?') + 'code=' + encodeURIComponent(m.code);
    const d = document.createElement('div'); d.className = 'label';
    d.innerHTML = '<div class="nm">' + esc(m.name || m.code) + '</div><div class="cd">' + esc(m.code) + '</div><div class="qr"></div>' +
      (m.prod ? '<div class="pd">Product ' + esc(m.prod) + '</div>' : '') +
      '<div class="scan">สแกนเพื่อบันทึก/ดูสถานะ · Scan to report / view status</div><div class="url">' + esc(url) + '</div>';
    out.appendChild(d);
    new QRCode(d.querySelector('.qr'), {text:url, width:200, height:200, correctLevel:QRCode.CorrectLevel.M});
  });
}

async function loadFromSystem(){
  $('msg').textContent = 'กำลังดึงรายชื่อ…';
  try {
    const r = await fetch(FB + '/machines.json?shallow=true'); if(!r.ok) throw new Error('HTTP ' + r.status);
    const codes = Object.keys(await r.json() || {}).sort();
    const rows = [];
    for (const c of codes){
      const i = await (await fetch(FB + '/machines/' + c + '/info.json')).json() || {};
      rows.push([c, i.name || '', i.product || ''].join(', '));
    }
    $('list').value = rows.join('\n'); $('msg').textContent = ''; gen();
  } catch(e){ $('msg').textContent = 'ดึงจากระบบไม่ได้ (' + e.message + ') กรุณาพิมพ์/วางรายชื่อเองแทน'; }
}
gen();
</script></body></html>
